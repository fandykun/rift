services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rift
      POSTGRES_USER: rift
      POSTGRES_PASSWORD: rift_dev_password
    ports:
      - "5432:5432"
    volumes:
      - rift-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rift -d rift"]
      interval: 5s
      timeout: 5s
      retries: 10

  rift:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      RIFT_ENV: development
      RIFT_DATABASE_URL: postgres://rift:rift_dev_password@postgres:5432/rift?sslmode=disable
      RIFT_MIGRATIONS_DIR: /app/migrations
      RIFT_PORT: "7878"
      RIFT_TOKEN: local-dev-token
    ports:
      - "7878:7878"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rift-postgres-data:
